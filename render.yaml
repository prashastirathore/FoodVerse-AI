services:
  - type: web
    name: foodverse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: foodverse_db
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
